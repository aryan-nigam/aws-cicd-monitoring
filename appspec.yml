
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/aws-cicd-monitoring

hooks:
  ApplicationStop:
    - location: scripts/stop_app.sh
      timeout: 30
      runas: root

  AfterInstall:
    - location: scripts/install_app.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start_app.sh
      timeout: 60
      runas: root
